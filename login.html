<!DOCTYPE html>
<html>
<head>
<title>Login Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        rgba(15,23,42,0.85),
        rgba(15,23,42,0.85)
    );
    font-family:'Poppins',sans-serif;
}

.login-box{
    width:430px;
    background:white;
    padding:50px 40px;
    border-radius:24px;
    box-shadow:0 25px 80px rgba(0,0,0,.25);
    text-align:center;
    position:relative; /* Important */
}

.login-box::before{
    content:"PRO";
    position:absolute;
    top:20px;
    right:20px;
    background:#2563EB;
    color:white;
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.login-box h2{
    color:#0F172A;
    font-size:32px;
    font-weight:700;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:16px;
    margin-bottom:18px;
    border:1px solid #CBD5E1;
    border-radius:14px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#2563EB;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

.login-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2563EB,#06B6D4);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(37,99,235,.30);
}

.home-btn{
    display:block;
    margin-top:20px;
    text-decoration:none;
    color:#2563EB;
    font-weight:600;
}

</style>
</head>

<body>

<div class="login-box">

    <h2>Login</h2>

    <form>
        <input type="email" placeholder="Enter Email" required>
        <input type="password" placeholder="Enter Password" required>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <a href="index.html" class="home-btn">
        Back to Home
    </a>

</div>

</body>
</html>
